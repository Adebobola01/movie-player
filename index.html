<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Player Playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #fff;
        --text: #1d2025;
        --muted: #687080;
        --border: #dde1e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111317;
          --panel: #1a1d23;
          --text: #e7e9ee;
          --muted: #9aa3b2;
          --border: #2c313a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 16px;
      }
      .source {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .source input {
        flex: 1 1 320px;
        min-width: 0;
      }
      input,
      select,
      button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
      }
      button {
        cursor: pointer;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 16px;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      movie-player {
        border-radius: 10px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        min-width: 0;
      }
      .panel h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 12px;
        margin: 0 0 16px;
        font:
          12px/1.6 ui-monospace,
          monospace;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #log {
        height: 220px;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        font:
          12px/1.6 ui-monospace,
          monospace;
      }
      #log li {
        border-bottom: 1px solid var(--border);
      }
      #log .error {
        color: #e5484d;
      }
      .hint {
        color: var(--muted);
        margin-top: 12px;
      }
      kbd {
        font:
          12px ui-monospace,
          monospace;
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
    </style>
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <main>
      <h1>Movie Player Playground</h1>
      <div class="source">
        <select id="preset" aria-label="Preset source">
          <option value="local">Local ffmpeg ladder (npm run streams)</option>
          <option value="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">
            HLS – Big Buck Bunny (Mux)
          </option>
          <option value="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
            MP4 – Flower (MDN)
          </option>
          <option value="/does-not-exist.m3u8">Broken URL (error overlay)</option>
          <option value="">Custom URL…</option>
        </select>
        <input id="src" aria-label="Stream URL" placeholder="https://…/master.m3u8" />
        <button id="load">Load</button>
      </div>

      <div class="layout">
        <div>
          <movie-player id="player" muted crossorigin="anonymous"></movie-player>
          <p class="hint">
            Click the player, then try <kbd>Space</kbd> <kbd>←</kbd> <kbd>→</kbd> <kbd>J</kbd>
            <kbd>L</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>M</kbd> <kbd>F</kbd> <kbd>P</kbd>
            <kbd>0</kbd>–<kbd>9</kbd>.
          </p>
        </div>
        <aside class="panel">
          <h2>State</h2>
          <dl id="state"></dl>
          <h2>Events</h2>
          <ul id="log"></ul>
        </aside>
      </div>
    </main>

    <script type="module">
      import { CONTROLLER_EVENTS } from '/src/index.ts';

      const LOCAL = '/streams/master.m3u8';
      const FALLBACK = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
      const player = document.getElementById('player');
      const preset = document.getElementById('preset');
      const input = document.getElementById('src');

      // The dev server answers unknown paths with index.html, so check the content type.
      const hasLocal = await fetch(LOCAL, { method: 'HEAD' })
        .then((r) => r.ok && !r.headers.get('content-type')?.includes('text/html'))
        .catch(() => false);

      const load = (src) => {
        input.value = src;
        player.src = src;
        const url = new URL(location.href);
        url.searchParams.set('src', src);
        history.replaceState(null, '', url);
      };

      preset.addEventListener('change', () => {
        if (preset.value === 'local') load(hasLocal ? LOCAL : FALLBACK);
        else if (preset.value) load(preset.value);
        else input.focus();
      });
      document.getElementById('load').addEventListener('click', () => load(input.value));
      input.addEventListener('keydown', (e) => e.key === 'Enter' && load(input.value));

      // ?src=… lets you share a playground link (and is used by the browser tests).
      const initial = new URLSearchParams(location.search).get('src');
      if (initial) {
        preset.value = [...preset.options].some((o) => o.value === initial) ? initial : '';
        load(initial);
      } else {
        if (!hasLocal) preset.options[0].textContent += ' – not generated, using Mux';
        load(hasLocal ? LOCAL : FALLBACK);
      }

      // State panel
      const stateEl = document.getElementById('state');
      const fmt = (v) =>
        typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(2)) : JSON.stringify(v);
      const renderState = () => {
        const s = player.state;
        const rows = {
          engine: player.controller.engineName ?? '—',
          status: s.status,
          currentTime: s.currentTime,
          duration: s.duration,
          live: s.live,
          buffered: s.buffered.map(([a, b]) => `${a.toFixed(0)}–${b.toFixed(0)}`).join(', ') || '—',
          volume: s.volume,
          muted: s.muted,
          rate: s.playbackRate,
          fullscreen: s.fullscreen,
          pip: s.pip,
          controls: s.controlsVisible ? 'visible' : 'hidden',
          error: s.error ? `${s.error.code}: ${s.error.message}` : '—',
        };
        stateEl.innerHTML = Object.entries(rows)
          .map(([k, v]) => `<dt>${k}</dt><dd>${typeof v === 'string' ? v : fmt(v)}</dd>`)
          .join('');
      };
      player.subscribe((s) => s, renderState);
      renderState();

      // Event log (timeupdate is skipped to keep it readable)
      const log = document.getElementById('log');
      for (const type of CONTROLLER_EVENTS) {
        if (type === 'timeupdate') continue;
        player.addEventListener(`mp-${type}`, (e) => {
          const li = document.createElement('li');
          const time = new Date().toLocaleTimeString([], { hour12: false });
          const extra =
            type === 'error'
              ? ` ${e.detail.code} ${e.detail.message}`
              : type === 'statechange'
                ? ` ${e.detail.previous} → ${e.detail.status}`
                : '';
          li.textContent = `${time} mp-${type}${extra}`;
          if (type === 'error') li.className = 'error';
          log.prepend(li);
          while (log.children.length > 100) log.lastChild.remove();
        });
      }
    </script>
  </body>
</html>
